kotlin.code.style=official
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
pluginGroup=plugin
pluginVersion=0.1.0
ideaSinceBuild=243
# Bounded upper compatibility ceiling. We advertise 2024.3 (243) through 2025.2 (252.*),
# which is the range exercised by the Plugin Verifier (see pluginVerification in
# build.gradle.kts). An open-ended bound was avoided because the terminal integration is
# only validated against this range; widening it later requires extending verifier coverage.
# This provider value is authoritative: build.gradle.kts feeds it into
# intellijPlatform.pluginConfiguration.ideaVersion.untilBuild, and patchPluginXml
# writes the until-build attribute from it.
ideaUntilBuild=252.*
